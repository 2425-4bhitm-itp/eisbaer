---
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-secret
type: Opaque
stringData:
  OPENSEARCH_INITIAL_ADMIN_PASSWORD: "REPLACE_ME"
---
# PVC für Node 1
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensearch-data-0
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# PVC für Node 2
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensearch-data-1
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
spec:
  clusterIP: None
  selector:
    app: opensearch
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
spec:
  serviceName: opensearch
  replicas: 2
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:latest
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          env:
            - name: cluster.name
              value: "opensearch-cluster"
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: discovery.seed_hosts
              value: "opensearch-0.opensearch,opensearch-1.opensearch"
            - name: cluster.initial_cluster_manager_nodes
              value: "opensearch-0,opensearch-1"
            - name: bootstrap.memory_lock
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-secret
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          ports:
            - containerPort: 9200
              name: rest
            - containerPort: 9600
              name: perf
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opensearch-data-0
        # Der PVC für Pod 1 wird über ein Patch/Overlay eingebracht (siehe Hinweis unten)
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-api
spec:
  type: NodePort
  selector:
    app: opensearch
  ports:
    - port: 9200
      targetPort: 9200
    - port: 9600
      targetPort: 9600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-dashboards
  template:
    metadata:
      labels:
        app: opensearch-dashboards
    spec:
      containers:
        - name: dashboards
          image: opensearchproject/opensearch-dashboards:latest
          ports:
            - containerPort: 5601
          env:
            - name: OPENSEARCH_HOSTS
              value: '["https://opensearch-0.opensearch:9200","https://opensearch-1.opensearch:9200"]'
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
spec:
  type: NodePort
  selector:
    app: opensearch-dashboards
  ports:
    - port: 5601
      targetPort: 5601
