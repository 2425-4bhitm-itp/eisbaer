apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensearch
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: it210176.cloud.htl-leonding.ac.at
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /(_plugins|_cluster|_search|eisbaer_rag_data)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: opensearch
                port:
                  number: 9200
