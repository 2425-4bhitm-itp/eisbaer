 name: GitHub Actions Quarkus Startup
 run-name: ${{ github.actor }} pushed something. Testing out if quarkus startup works. 🚀
 on: [ push ]
 jobs:
   Explore-GitHub-Actions:
     runs-on: ubuntu-24.04
     steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-java@v4
         with:
           distribution: 'temurin'
           java-version: '21'
           cache: 'maven'
           cache-dependency-path: 'backend/pom.xml'
       - name: Build with Maven
         working-directory: backend
         run: mvn -B package
       - name: list files
         working-directory: backend
         run: |
           pwd
           ls -l
           ll ./target