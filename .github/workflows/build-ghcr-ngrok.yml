name: Build, Push GHCR & Expose via ngrok

on:
  push:
    branches: [ origin/test-ngrok ]
  workflow_dispatch:

jobs:
  build-and-expose:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # notwendig für GHCR Push
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # NodeJS für npm build im frontend
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Buildscript ausführen
      - name: Run build.sh
        run: |
          chmod +x ./build.sh
          ./build.sh

      # In GHCR einloggen
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image taggen & pushen
      - name: Tag & Push eisbaer-frontend image to GHCR
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/eisbaer-frontend:latest
          docker tag eisbaer-frontend:latest $IMAGE_NAME
          docker push $IMAGE_NAME

      # ngrok installieren
      - name: Install ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | \
            sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | \
            sudo tee /etc/apt/sources.list.d/ngrok.list >/dev/null
          sudo apt update && sudo apt install -y ngrok

      # ngrok starten (Port 4200)
      - name: Start ngrok tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          ngrok http 4200 > ngrok.log &
          sleep 8
          echo "Tunnel info:"
          curl 127.0.0.1:4040/api/tunnels

      - name: Keep alive for 1 hour
        run: sleep 3600
