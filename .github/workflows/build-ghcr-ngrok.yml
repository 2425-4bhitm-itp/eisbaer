name: Build and Push Docker Images to GHCR

on:
  push:
    branches: [test-ghcr]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1️Build frontend (Node)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 2️Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3️Install Docker Compose
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose jq

      # 4️Build all images and push them to GHCR
      - name: Build and push Docker images to GHCR
        env:
          REGISTRY: ghcr.io
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          cd docker-compose
          docker compose build

          # Extract image names from docker-compose.yaml
          IMAGES=$(docker compose config | grep 'image:' | awk '{print $2}')

          echo "Found images:"
          echo "$IMAGES"

          for IMAGE in $IMAGES; do
            SERVICE=$(basename "$IMAGE")
            TAG="${GITHUB_SHA::7}"   # Short commit hash as version
            GHCR_IMAGE="${REGISTRY}/${OWNER}/${REPO}-${SERVICE}:${TAG}"

            echo "Tagging $IMAGE as $GHCR_IMAGE"
            docker tag "$IMAGE" "$GHCR_IMAGE"

            echo "Pushing $GHCR_IMAGE"
            docker push "$GHCR_IMAGE"

            # Also push 'latest' tag
            LATEST_IMAGE="${REGISTRY}/${OWNER}/${REPO}-${SERVICE}:latest"
            docker tag "$IMAGE" "$LATEST_IMAGE"
            docker push "$LATEST_IMAGE"
          done

      # (Optional) List all images pushed
      - name: List pushed images
        run: docker images | grep ghcr.io
