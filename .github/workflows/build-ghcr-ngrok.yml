name: Build and Deploy with Ngrok

on:
  push:
    branches: [test-ngrok]
  workflow_dispatch:  # Manuelles Auslösen

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start services with Docker Compose
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # Secret aus GitHub
        run: |
          # Optional .env für Skripte
          echo "OPENAI_API_KEY=${OPENAI_API_KEY}" > .env
          # Compose-Datei im Unterordner angeben
          docker compose -f docker-compose/docker-compose.yml up -d --build

      - name: Install ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | \
            sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null &&
            echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | \
            sudo tee /etc/apt/sources.list.d/ngrok.list &&
            sudo apt update && sudo apt install ngrok

      - name: Auth with ngrok
        run: ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Start ngrok tunnel
        run: nohup ngrok http 8080 > ngrok.log &

      - name: Wait for services
        run: sleep 30

      - name: Run Quarkus Build LLM Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          chmod +x ./buildLLM.sh
          ./buildLLM.sh

      - name: Show ngrok URL
        run: cat ngrok.log | grep -o 'https://[0-9a-z]*\.ngrok-free\.app' || true

      - name: Stop Docker Compose after job
        if: always()
        run: docker compose down
